[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "game-census"
dynamic = ["version"]
description = "Self-hosted observations of Steam game activity"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.5",
  "jinja2==3.1.6",
]

[project.scripts]
game-census = "game_census.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "playwright==1.62.0", "hatchling==1.32.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the isolated PostgreSQL test instance", "browser: browser journey checks"]

[tool.hatch.build.targets.wheel]
packages = ["src/game_census"]

[tool.hatch.build]
reproducible = true

[tool.hatch.version]
path = "src/game_census/__init__.py"
